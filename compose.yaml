name: ${COMPOSE_PROJECT_NAME:-cad-qa}

services:
  app:
    image: ${CAD_IMAGE:-cad-qa:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        BUILD_JOBS: ${BUILD_JOBS:-1}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    env_file:
      - path: ${CAD_RUNTIME_ENV:-./.secrets/runtime.env}
        format: raw
    environment:
      CAD_WEB_DEV_MODE: "0"
      CAD_PUBLIC_ORIGIN: ${CAD_PUBLIC_ORIGIN:-https://localhost:${CAD_HTTPS_PORT:-8443}}
      CAD_PUBLIC_PREFIX: /cad
      CAD_AUTH_DB: /data/auth.sqlite3
      CAD_SESSION_TTL_SECONDS: ${CAD_SESSION_TTL_SECONDS:-28800}
      CAD_CJK_FONT: /app/fonts/NotoSansSC-Regular.ttf
      CAD_DWG_CONVERTER: libredwg
      CAD_DWG_EXECUTABLE: /usr/local/bin/dwg2dxf
      CAD_VISION_ENABLED: "false"
      CAD_LOG_LEVEL: WARNING
      OTEL_ENABLED: "false"
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    ports:
      - "127.0.0.1:${CAD_HTTP_PORT:-8323}:8000"
    volumes:
      - cad_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  cad_data:
